name: Validate EvoSnake
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check base.js
          node --check skins.js
          node --check spatial.js
          node --check entities.js
          node --check render.js
          node --check effects.js
          node --check sound.js
          node --check main-core.js
          node --check controls.js
          node --check tests/e2e.mjs
      - name: Check required files
        run: test -f index.html && test -f style.css && test -f v2.css && test -f base.js && test -f skins.js && test -f spatial.js && test -f entities.js && test -f render.js && test -f effects.js && test -f sound.js && test -f main-core.js && test -f controls.js && test -f tests/e2e.mjs
