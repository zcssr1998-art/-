name: E2E Gameplay Controls
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install browser driver library
        run: npm install --no-save playwright-core@1.55.0
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/evosnake-http.log 2>&1 &
          echo $! > /tmp/evosnake-http.pid
          sleep 1
          curl -f http://127.0.0.1:4173/ >/dev/null
      - name: Run browser gameplay test
        run: node tests/e2e.mjs
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/evosnake-http.log || true
